<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角洲 - 隨機出裝轉盤</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .player-frame {
            border: 2px groove #dddddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f8f8f8;
        }
        .player-frame legend {
            font-weight: bold;
            color: #333333;
            font-size: 15px;
            padding: 0 5px;
        }
        .radio-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .radio-group label {
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .radio-group label:hover {
            background: #eef;
            border-color: #2196F3;
        }
        
        /* 初始隱藏區塊 */
        #map_zone, #wheel_zone {
            display: none;
        }
        
        h2 {
            font-size: 24px;
            color: #333333;
            margin: 15px 0;
            font-weight: bold;
            min-height: 32px;
        }
        .wheel-frame {
            width: 350px;
            height: 100px; /* 恢復原本舒適的文字高度 */
            background: #ffffff;
            border: 2px solid #cccccc;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .display-label {
            font-size: 24px;
            color: #666666;
            font-weight: normal;
        }
        .spin-button {
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #4CAF50; /* 預設亮綠色，保證可用 */
            border: none
